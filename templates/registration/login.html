{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1B3F8F">
  <title>Entrar · Confin</title>
  <script>(function () { try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();</script>
  <link rel="icon" href="{% static 'favicon/confin.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/confin.css' %}" rel="stylesheet">
</head>
<body class="auth">
  <header class="auth-band">
    <div class="band-inner">
      <p class="brand brand-on-band"><span class="brand-mark" aria-hidden="true"></span>confin</p>
      <h1 class="auth-title">As contas da família, num lugar só.</h1>
    </div>
  </header>
  <main class="auth-card card card-pad">
    <h2 class="section-title">Entrar</h2>
    {% if form.errors %}<p class="form-errors" role="alert">Usuário ou senha incorretos. Confira e tente de novo.</p>{% endif %}
    <form method="post" class="auth-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="fld"><label class="fld-label" for="id_username">Usuário</label><input id="id_username" type="text" name="username" autocomplete="username" autocapitalize="none" autofocus required class="field" value="{{ form.username.value|default:'' }}"></div>
      <div class="fld"><label class="fld-label" for="id_password">Senha</label><input id="id_password" type="password" name="password" autocomplete="current-password" required class="field"></div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </main>
</body>
</html>
