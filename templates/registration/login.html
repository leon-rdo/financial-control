{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar - Controle Financeiro</title>
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-base-100 rounded-xl border border-base-300/40 p-6">
        <h1 class="text-lg font-semibold">Controle Financeiro</h1>
        <p class="text-sm text-base-content/50 mt-1 mb-5">Entre para continuar</p>

        {% if form.errors %}
        <div class="alert alert-error text-sm mb-4">Usuário ou senha incorretos.</div>
        {% endif %}

        <form method="post" class="space-y-3">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label for="id_username" class="text-xs text-base-content/50 mb-1 block">Usuário</label>
                <input id="id_username" type="text" name="username" autocomplete="username" autofocus required class="input input-bordered w-full">
            </div>
            <div>
                <label for="id_password" class="text-xs text-base-content/50 mb-1 block">Senha</label>
                <input id="id_password" type="password" name="password" autocomplete="current-password" required class="input input-bordered w-full">
            </div>
            <button type="submit" class="btn btn-neutral w-full mt-2">Entrar</button>
        </form>
    </div>
</body>
</html>
