# /etc/nginx/sites-available/confin (ligado por symlink em sites-enabled).
# Este é o arquivo ANTES do certbot: escuta só na 80. Depois de
#
#     certbot --nginx -d confin.site -d www.confin.site
#
# o certbot acrescenta o listen 443 ssl e o redirecionamento de http.
#
# SEMPRE `nginx -t` antes de recarregar: um erro aqui derruba os outros sites.

server {
    listen 80;
    listen [::]:80;
    server_name confin.site www.confin.site;

    client_max_body_size 2m;

    # Dados financeiros pessoais: nada de indexação.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\.(?!well-known/) { return 444; }

    location /static/ {
        alias /var/www/confin/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Força bruta no login: no máximo 10 tentativas por minuto por IP
    # (zona definida em /etc/nginx/conf.d/confin-ratelimit.conf).
    location ~ ^/(entrar|admin/login)/ {
        limit_req zone=confin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sem este cabeçalho o Django não sabe que a requisição veio por HTTPS
        # e a checagem de origem do CSRF falha.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    error_log /var/log/nginx/confin_error.log;
    access_log /var/log/nginx/confin_access.log;
}
